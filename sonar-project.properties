# SonarQube / SonarCloud configuration for the Jenkins "Code Quality" stage.
# Run via: sonar-scanner (Jenkins SonarQube Scanner plugin), pointed at a
# SonarQube server configured in Jenkins under Manage Jenkins > System.

sonar.projectKey=budgetmate-api
sonar.projectName=BudgetMate API
sonar.projectVersion=1.0

sonar.sources=lib,server.js,scripts
sonar.tests=test
sonar.test.inclusions=test/**/*.test.js

sonar.language=js
sonar.sourceEncoding=UTF-8

# ESLint findings are also reported into Sonar for a single pane of glass
sonar.eslint.reportPaths=eslint-report.json

# JUnit test report import (produced by `npm test`, see package.json)
sonar.testExecutionReportPaths=test-results.xml

# Quality gate: fail the pipeline if the gate is not green (see Jenkinsfile
# "Code Quality" stage — `waitForQualityGate abortPipeline: true`)
sonar.qualitygate.wait=true
